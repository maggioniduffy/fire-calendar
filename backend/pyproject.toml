[project]
name = "firecal"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS fire calendar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "pandas",
    "pyarrow",
    "typer",
    "lightgbm>=4.7.0",
    "shapely>=2.2.0",
    "pyhdf>=0.11.7",
]

[project.scripts]
firecal = "firecal.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firecal"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not slow"'
markers = ["slow: real data or long runs; excluded from CI"]
