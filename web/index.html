<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendario de fuego · NASA Space Apps 2026 · Desafío CONAE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the stored or system theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem("firecal.prefs") || "{}");
        document.documentElement.dataset.theme =
          p.theme === "dark" || p.theme === "light"
            ? p.theme
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (p.lang === "en") document.documentElement.lang = "en";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
