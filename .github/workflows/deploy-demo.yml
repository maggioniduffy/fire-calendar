name: Deploy demo

# Manual: rebuilds data/ from FIRMS, NOAA CPC and geoBoundaries, exports per province and department, builds the
# static web and deploys it to Cloudflare Pages (project fire-calendar). Secrets: CLOUDFLARE_API_TOKEN (Pages edit)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make install
      - name: Data pipeline
        run: make data
      - name: Static export
        run: make static-export
        env:
          WORKERS: "2"
      - name: Static site
        run: make static-site
      - name: Check that Córdoba is in the site
        run: test -s data/publish/site/data/calendar/p-cordoba/viirs_eq.json && test -s data/publish/site/index.html
      - name: Deploy to Cloudflare Pages
        run: >-
          npx -y wrangler@4.40.0 pages deploy data/publish/site --project-name fire-calendar --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
